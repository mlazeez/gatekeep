[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeep"
version = "0.1.0"
description = "Agent control surface: vault-backed rollback, typed hooks, circuit breaker, audit log"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ai", "agents", "safety", "rollback", "llm"]

[project.scripts]
gatekeep = "gatekeep:main"

[tool.setuptools]
py-modules = ["gatekeep"]